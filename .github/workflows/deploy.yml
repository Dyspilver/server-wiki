# VitePress 站点自动构建并发布到 GitHub Pages
# 官方参考：https://vitepress.dev/guide/deploy#github-pages
name: Deploy VitePress site to Pages

on:
  # 每当 main 分支有新的推送时触发
  push:
    branches: [main]
  # 允许在 GitHub 网页上手动点击运行
  workflow_dispatch:

# 授予 GitHub Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务在跑，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 才能拿到完整提交历史，
          # 这样 VitePress 的 lastUpdated（上次更新时间）才准确
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # VitePress 的构建产物目录
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
